providers = ["node"]

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
NPM_CONFIG_OPTIONAL = "true"

[phases.install]
cmds = ["npm ci --include=dev --include=optional"]
cacheDirectories = ["/root/.npm"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]
cacheDirectories = ["node_modules/.cache"]

[start]
cmd = "npm run start"
