name: Sync plugin catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize curated plugins
        run: npm run plugins:sync
        env:
          DSHHUB_PAGES: "8"
      - name: Install and verify production build
        run: npm ci --include=dev --include=optional && npm run build
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- app/plugins.json README.md; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/plugins.json README.md
          git commit -m "chore: sync plugin catalog"
          git push
